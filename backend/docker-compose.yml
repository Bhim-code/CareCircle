# Starts PostgreSQL for local development:  docker compose up -d
# Creates two databases: carecircle (for the API) and carecircle_test (for pytest).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: carecircle
      POSTGRES_PASSWORD: carecircle
      POSTGRES_DB: carecircle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carecircle"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
